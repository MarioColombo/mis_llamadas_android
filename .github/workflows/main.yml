name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev \
            autopoint gettext pkg-config build-essential zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev
          pip install --upgrade buildozer "cython<3"

      - name: Compilar
        run: yes | buildozer android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: misllamadas-apk
          path: bin/*.apk
